[project]
name = "linkedbuddy"
version = "0.1.0"
description = "LinkedBuddy backend: turns GitHub activity into LinkedIn post drafts"
readme = "README.md"
authors = [
    { name = "iloveass7", email = "borshonjsr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.5",
    "google-genai>=2.32.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
